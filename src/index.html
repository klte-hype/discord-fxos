<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Discord WAP for Firefox OS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
        background: #181818;
        color: #fff;
      }

      #selector-screen {
        width: 100%;
        height: 100%;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      #selector-screen.hidden {
        display: none;
      }

      h1 {
        font-size: 17px;
        line-height: 1.2;
        margin: 0 0 3px 0;
      }

      h2 {
        font-size: 13px;
        line-height: 1.25;
        font-weight: normal;
        color: #ccc;
        margin: 0 0 8px 0;
      }

      .option-box {
        display: block;
        padding: 7px 8px;
        margin-bottom: 7px;
        background: #262626;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
      }

      .option-box input[type="radio"] {
        vertical-align: middle;
        margin: 0 5px 0 0;
      }

      .option-title {
        font-weight: bold;
        font-size: 12px;
        line-height: 1.25;
        vertical-align: middle;
      }

      .option-url {
        display: block;
        font-size: 11px;
        line-height: 1.2;
        color: #bbb;
        margin-top: 3px;
        margin-left: 18px;
        word-break: break-all;
      }

      #custom-url {
        width: 100%;
        margin-top: 6px;
        padding: 5px 6px;
        font-size: 13px;
        box-sizing: border-box;
        background: #111;
        color: #fff;
        border: 1px solid #666;
        border-radius: 3px;
      }

      #open-btn {
        width: 100%;
        padding: 9px 10px;
        font-size: 13px;
        font-weight: bold;
        background: #2b6cb0;
        color: #fff;
        border: none;
        border-radius: 4px;
        margin-top: 4px;
        margin-bottom: 8px;
        cursor: pointer;
      }

      #viewer-screen {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
      }

      #viewer-screen.active {
        display: block;
      }

      #browser-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #fff;
      }

      #back-btn {
        position: fixed;
        bottom: 6px;
        right: 6px;
        z-index: 10;
        padding: 4px 7px;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 3px;
      }

      @media screen and (max-width: 340px), screen and (max-height: 360px) {
        #selector-screen {
          padding: 7px;
        }

        h1 {
          font-size: 15px;
          margin-bottom: 2px;
        }

        h2 {
          font-size: 12px;
          margin-bottom: 6px;
        }

        .option-box {
          padding: 6px;
          margin-bottom: 6px;
        }

        .option-title {
          font-size: 11px;
        }

        .option-url {
          font-size: 10px;
          margin-left: 16px;
        }

        #custom-url {
          font-size: 12px;
          padding: 5px 6px;
        }

        #open-btn {
          padding: 8px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="selector-screen">
      <h1>Discord WAP for Firefox OS - v0.1.0</h1>
      <h2>Select URL</h2>

      <label class="option-box" for="radio-default">
        <input type="radio" name="url_mode" id="radio-default" value="default" checked>
        <span class="option-title">Default URL (gtrxAC's Discord WAP site)</span>
        <span class="option-url">http://wap.gtrxac.fi/</span>
      </label>

      <div class="option-box">
        <label for="radio-custom">
          <input type="radio" name="url_mode" id="radio-custom" value="custom">
          <span class="option-title">Custom URL (use this if you're hosting you're own server or want to use another Discord WAP page)</span>
        </label>
        <input type="url" id="custom-url" placeholder="http://example.com">
      </div>

      <button type="button" id="open-btn">Start</button>
    </div>

    <div id="viewer-screen">
      <iframe id="browser-frame" mozbrowser></iframe>
      <button type="button" id="back-btn">Back</button>
    </div>

    <script>
      var DEFAULT_URL = "http://wap.gtrxac.fi/";
      var selectorScreen = document.getElementById("selector-screen");
      var viewerScreen = document.getElementById("viewer-screen");
      var radioDefault = document.getElementById("radio-default");
      var radioCustom = document.getElementById("radio-custom");
      var customInput = document.getElementById("custom-url");
      var openBtn = document.getElementById("open-btn");
      var backBtn = document.getElementById("back-btn");
      var frameEl = document.getElementById("browser-frame");

      function clean(str) {
        return (str || "").replace(/^\s+|\s+$/g, "");
      }

      function normalizeUrl(raw) {
        var text = clean(raw);
        if (!text) return null;
        if (/^https?:\/\//i.test(text)) {
          return text;
        }
        return "http://" + text;
      }

      function showViewer(url) {
        frameEl.src = url;
        selectorScreen.className = "hidden";
        viewerScreen.className = "active";
        try {
          window.localStorage.setItem("wap_last_mode", radioCustom.checked ? "custom" : "default");
          window.localStorage.setItem("wap_last_custom", customInput.value);
        } catch (e) {}
      }

      function showSelector() {
        viewerScreen.className = "";
        selectorScreen.className = "";
      }

      try {
        var savedCustom = window.localStorage.getItem("wap_last_custom");
        var savedMode = window.localStorage.getItem("wap_last_mode");
        if (savedCustom) {
          customInput.value = savedCustom;
        }
        if (savedMode === "custom") {
          radioCustom.checked = true;
          radioDefault.checked = false;
        }
      } catch (e) {}

      customInput.onfocus = function() {
        radioCustom.checked = true;
        radioDefault.checked = false;
      };

      openBtn.onclick = function() {
        var targetURL = DEFAULT_URL;
        if (radioCustom.checked) {
          targetURL = normalizeUrl(customInput.value);
          if (!targetURL) {
            try { customInput.focus(); } catch (e) {}
            return;
          }
          customInput.value = targetURL;
        }
        showViewer(targetURL);
      };

      customInput.onkeydown = function(ev) {
        var e = ev || window.event;
        var code = e.keyCode || e.which;
        if (code === 13) {
          openBtn.onclick();
        }
      };

      backBtn.onclick = function() {
        showSelector();
      };
    </script>
  </body>
</html>
